aid: immune-onc-therapeutics
name: Immune-Onc Therapeutics
description: >-
  Immune-Onc Therapeutics, Inc. is a clinical-stage biopharmaceutical company headquartered in Palo
  Alto, California, founded in 2016 by Charlene Liao and Guo Liang Yu. The company develops novel
  antibody therapeutics that target myeloid cell inhibitory receptors — with a current focus on the
  Leukocyte Immunoglobulin-Like Receptor subfamily B (LILRB) — to treat blood cancers, solid tumors,
  and autoimmune and inflammatory disease. Its clinical pipeline includes IO-108, a fully human IgG4
  antagonist antibody targeting LILRB2 (ILT4) in Phase 1b/2 for solid tumors including hepatocellular
  carcinoma, and IO-202, a first-in-class IgG1 antibody targeting LILRB4 (ILT3) in Phase 1b for acute
  myeloid leukemia and chronic myelomonocytic leukemia, which holds FDA Fast Track and Orphan Drug
  designations. Preclinical programs include IO-312, a LILRB4-directed bispecific antibody, and IO-106
  targeting LAIR1. The company has clinical collaborations with BeiGene, Regeneron, and Roche, and has
  raised approximately $138 million across Series A and Series B financings from investors including
  Northern Light Venture Capital, Vivo Capital, CLI Ventures, and the Stanford-StartX Fund. Immune-Onc
  is a therapeutics developer, not a software or platform company: as of this profile it publishes no
  public API, developer portal, OpenAPI or other machine-readable contract, no SDKs, no public GitHub
  organization and no /.well-known/ discovery surface — its only machine-readable documents are two
  Squarespace RSS feeds for its news and press-release collections. This record therefore captures the
  company's verified public identity, its published web properties, its clinical-trial registry
  presence, and the probed security posture of its public web surface.
